name: Build ARM Virtual Machine Firmware

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target architecture'
        required: false
        default: 'armsr/armv8'
        type: choice
        options:
          - armsr/armv8
          - armsr/armv7
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/build-armvirt.yml'
      - 'target/linux/armsr/**'
      - 'package/**'
      - 'config/**'
  pull_request:
    paths:
      - '.github/workflows/build-armvirt.yml'
      - 'target/linux/armsr/**'
      - 'package/**'
      - 'config/**'

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ARM Virtual Machine Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up environment
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils \
            bzip2 \
            diffutils \
            findutils \
            flex \
            gawk \
            gcc \
            g++ \
            grep \
            libc-dev \
            libz-dev \
            make \
            perl \
            python3 \
            rsync \
            subversion \
            unzip \
            which \
            wget \
            curl \
            git \
            file \
            gcc-multilib \
            g++-multilib \
            libncurses5-dev \
            libncursesw5-dev \
            zlib1g-dev \
            libssl-dev \
            libelf-dev \
            bc \
            cpio \
            xz-utils \
            util-linux \
            coreutils
          
          echo "Environment setup completed"

      - name: Update feeds
        run: |
          set -e
          echo "Updating feeds..."
          ./scripts/feeds update -a || {
            echo "Feeds update failed!"
            exit 1
          }

      - name: Install feeds
        run: |
          set -e
          echo "Installing feeds..."
          ./scripts/feeds install -a || {
            echo "Feeds install failed!"
            exit 1
          }

      - name: Configure build
        run: |
          set -e  # 遇到错误立即退出
          
          # 设置目标为 ARM 虚拟机
          TARGET="${{ github.event.inputs.target || 'armsr/armv8' }}"
          TARGET_ARCH=$(echo $TARGET | cut -d'/' -f1)
          TARGET_SUBTARGET=$(echo $TARGET | cut -d'/' -f2)
          
          echo "Configuring for target: $TARGET_ARCH/$TARGET_SUBTARGET"
          
          # 创建基础配置文件
          # 首先设置目标架构
          if [ "$TARGET_SUBTARGET" = "armv8" ]; then
            echo "CONFIG_TARGET_armsr=y" > .config
            echo "CONFIG_TARGET_armsr_armv8=y" >> .config
            echo "CONFIG_TARGET_armsr_armv8_generic=y" >> .config
          else
            echo "CONFIG_TARGET_armsr=y" > .config
            echo "CONFIG_TARGET_armsr_armv7=y" >> .config
            echo "CONFIG_TARGET_armsr_armv7_generic=y" >> .config
          fi
          
          # 运行 defconfig 生成完整配置
          echo "Running defconfig..."
          make defconfig || {
            echo "defconfig failed, showing error..."
            cat .config 2>/dev/null || true
            exit 1
          }
          
          # 启用 gzip 压缩
          echo "Enabling gzip compression..."
          if grep -q "# CONFIG_TARGET_IMAGES_GZIP is not set" .config; then
            sed -i 's/# CONFIG_TARGET_IMAGES_GZIP is not set/CONFIG_TARGET_IMAGES_GZIP=y/' .config
          elif ! grep -q "CONFIG_TARGET_IMAGES_GZIP=y" .config; then
            echo "CONFIG_TARGET_IMAGES_GZIP=y" >> .config
          fi
          
          # 设置根文件系统分区大小（512MB）
          if grep -q "CONFIG_TARGET_ROOTFS_PARTSIZE=" .config; then
            sed -i 's/CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=512/' .config
          else
            echo "CONFIG_TARGET_ROOTFS_PARTSIZE=512" >> .config
          fi
          
          # 设置内核分区大小（64MB）
          if grep -q "CONFIG_TARGET_KERNEL_PARTSIZE=" .config; then
            sed -i 's/CONFIG_TARGET_KERNEL_PARTSIZE=.*/CONFIG_TARGET_KERNEL_PARTSIZE=64/' .config
          else
            echo "CONFIG_TARGET_KERNEL_PARTSIZE=64" >> .config
          fi
          
          # 确保选择了 generic 设备
          GENERIC_CONFIG="CONFIG_TARGET_${TARGET_ARCH}_${TARGET_SUBTARGET}_generic"
          if grep -q "# ${GENERIC_CONFIG} is not set" .config; then
            sed -i "s/# ${GENERIC_CONFIG} is not set/${GENERIC_CONFIG}=y/" .config
          elif ! grep -q "${GENERIC_CONFIG}=y" .config; then
            echo "${GENERIC_CONFIG}=y" >> .config
          fi
          
          # 重新运行 defconfig 以应用所有依赖配置
          echo "Running defconfig again to apply dependencies..."
          make defconfig || {
            echo "Second defconfig failed..."
            exit 1
          }
          
          # 显示关键配置
          echo "=== Key configuration ==="
          grep -E "CONFIG_TARGET_armsr|CONFIG_TARGET_IMAGES_GZIP|CONFIG_TARGET_ROOTFS_PARTSIZE|CONFIG_TARGET_KERNEL_PARTSIZE" .config | head -10 || true
          
          # 验证配置
          echo "=== Verifying configuration ==="
          if ! grep -q "CONFIG_TARGET_armsr=y" .config; then
            echo "ERROR: CONFIG_TARGET_armsr=y not found!"
            exit 1
          fi
          
          if [ "$TARGET_SUBTARGET" = "armv8" ]; then
            if ! grep -q "CONFIG_TARGET_armsr_armv8=y" .config; then
              echo "ERROR: CONFIG_TARGET_armsr_armv8=y not found!"
              exit 1
            fi
            if ! grep -q "CONFIG_TARGET_armsr_armv8_generic=y" .config; then
              echo "ERROR: CONFIG_TARGET_armsr_armv8_generic=y not found!"
              exit 1
            fi
            # 验证架构（armv8 应该是 aarch64）
            if ! grep -q "CONFIG_aarch64=y" .config; then
              echo "WARNING: CONFIG_aarch64=y not found, but this may be set by defconfig"
            fi
          else
            if ! grep -q "CONFIG_TARGET_armsr_armv7=y" .config; then
              echo "ERROR: CONFIG_TARGET_armsr_armv7=y not found!"
              exit 1
            fi
            if ! grep -q "CONFIG_TARGET_armsr_armv7_generic=y" .config; then
              echo "ERROR: CONFIG_TARGET_armsr_armv7_generic=y not found!"
              exit 1
            fi
          fi
          
          echo "✓ Configuration verification passed!"
          echo "Configuration completed successfully!"

      - name: Build firmware
        run: |
          set -e  # 遇到错误立即退出
          
          echo "Starting firmware build..."
          echo "Available CPU cores: $(nproc)"
          
          # 验证配置存在
          if [ ! -f .config ]; then
            echo "ERROR: .config file not found!"
            exit 1
          fi
          
          # 使用多核编译加速，但限制并发数避免内存不足
          JOBS=$(( $(nproc) > 4 ? 4 : $(nproc) ))
          echo "Building with $JOBS parallel jobs..."
          
          make -j$JOBS V=s 2>&1 | tee build.log || {
            echo "Build failed! Showing last 100 lines of build.log:"
            tail -100 build.log || true
            exit 1
          }
          
          echo "Build completed successfully!"

      - name: List build artifacts
        run: |
          echo "=== Build artifacts ==="
          find bin/targets -name "*.img.gz" -o -name "*.img" | head -20 || true
          echo "=== Build directory structure ==="
          ls -la bin/targets/ || true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.event.inputs.target || 'armsr-armv8' }}-${{ github.sha }}
          path: |
            bin/targets/**/*.img.gz
            bin/targets/**/*.img
            bin/targets/**/*.buildinfo
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs-${{ github.sha }}
          path: |
            logs/
            **/*.log
          retention-days: 7
          if-no-files-found: ignore

